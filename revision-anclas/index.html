<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión en sitio de anclas para columnas — Park In Tlal — Bodega 18A | GRUPO ARCA</title>
<meta name="description" content="Verificación topográfica de anclas coladas previa al montaje de la estructura metálica">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logo-arca.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --negro:#211915; --rojo:#C3360E; --gris:#6B6B6B; --gris-cl:#F2F0EE; --linea:#E2DDD6;
  --fondo:#FAF8F5; --papel:#FFFFFF; --tinta:#211915;
  --proy:#2E7D32; --obra:#D7261E; --base:#1F5FBF; --prop:#C98A00;
  --sombra:0 1px 2px rgba(33,25,21,.06),0 4px 16px rgba(33,25,21,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--fondo);color:var(--tinta);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Barlow,Inter,sans-serif;line-height:1.15;margin:0}
a{color:var(--rojo)}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
/* membrete */
.top{background:var(--papel);border-bottom:3px solid var(--rojo);box-shadow:0 2px 0 var(--negro)}
.top .wrap{display:flex;align-items:center;gap:20px;padding-top:12px;padding-bottom:10px}
.top img{height:44px;width:auto}
.top .meta{margin-left:auto;text-align:right;font-size:12.5px;color:var(--gris)}
.top .meta b{display:block;color:var(--negro);font:700 14px Barlow;letter-spacing:.06em;text-transform:uppercase}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:8px;font-weight:600;font-size:13.5px;text-decoration:none;border:1.5px solid var(--negro);color:var(--negro);background:var(--papel);cursor:pointer}
.btn.primario{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn svg{width:16px;height:16px}
/* portada: diagnóstico 3D + resumen */
.diag{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:18px;padding:18px 0 8px}
.visor{position:relative;height:min(78vh,760px);min-height:520px;border-radius:14px;overflow:hidden;background:linear-gradient(#eef0f2,#dfe3e7);box-shadow:var(--sombra)}
.visor canvas{display:block}
.visor .capas,.visor .vistas,.visor .simb{z-index:5}
.visor .carga{position:absolute;inset:0;display:grid;place-items:center;color:var(--gris)}
.visor .capas{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 12px;font-size:12.5px;box-shadow:var(--sombra);max-width:250px}
.visor .capas summary{cursor:pointer;font:700 13px Barlow;text-transform:uppercase;letter-spacing:.05em;list-style:none}
.visor .capas label{display:flex;align-items:center;gap:7px;margin:3px 0;cursor:pointer}
.visor .vistas{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px}
.visor .vistas button{font:600 13px Inter;padding:7px 12px;border-radius:8px;border:none;background:rgba(33,25,21,.88);color:#fff;cursor:pointer;text-align:left}
.visor .vistas button.on{background:var(--rojo)}
.visor .simb{position:absolute;left:12px;bottom:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px 14px;background:rgba(255,255,255,.95);border-radius:10px;padding:8px 12px;font-size:12px;box-shadow:var(--sombra)}
.simb span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.simb i{display:inline-block;flex:none}
.i-proy{width:5px;height:16px;border-radius:2px;background:var(--proy)}
.i-obra{width:5px;height:16px;border-radius:2px;background:var(--obra)}
.i-base{width:9px;height:9px;border-radius:50%;background:var(--base)}
.i-pplaca{width:18px;height:11px;border:2px solid var(--proy);background:rgba(46,125,50,.15)}
.i-prop{width:18px;height:11px;border:2px solid var(--prop);background:rgba(201,138,0,.25)}
.i-des{width:18px;height:0;border-top:2.5px solid var(--obra)}
.i-dpl{width:18px;height:0;border-top:2.5px solid var(--base)}
.i-hp{width:11px;height:11px;border-radius:50%;border:2px solid var(--proy)}
.i-ho{width:11px;height:11px;border-radius:50%;background:var(--obra)}
.i-hb{width:11px;height:11px;border-radius:50%;border:2px solid var(--prop)}
.etq{font:600 11.5px Inter;color:#fff;background:rgba(33,25,21,.86);padding:2px 7px;border-radius:5px;white-space:nowrap}
.etq.ancla{background:var(--obra);font-size:10.5px;padding:1px 5px}
.etq.cota{background:var(--prop);color:#211915}
.etq.cota.v{background:var(--proy);color:#fff}
.etq.eje{background:#fff;color:var(--negro);border:1.5px solid var(--negro);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;padding:0}
.resumen{background:var(--papel);border-radius:14px;box-shadow:var(--sombra);padding:20px 22px;display:flex;flex-direction:column;gap:12px;max-height:min(78vh,760px);min-height:520px;overflow:auto}
.resumen .proy{font-size:12px;color:var(--gris);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.resumen h1{font-size:25px}
.resumen h3{font:700 13px Barlow;text-transform:uppercase;letter-spacing:.06em;color:var(--rojo);margin:4px 0 2px}
.resumen p,.resumen li{font-size:13.5px;margin:0}
.resumen ul{margin:0;padding-left:18px}.resumen li{margin:3px 0}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini div{background:var(--gris-cl);border-radius:8px;padding:7px 8px;font-size:11px;color:var(--gris);line-height:1.25}
.mini b{display:block;font:700 18px Barlow;color:var(--negro)}
.mini .r b{color:var(--rojo)}
.fotos2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fotos2 figure{margin:0;cursor:zoom-in}
.fotos2 img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;display:block}
.fotos2 figcaption{font-size:11px;color:var(--gris);margin-top:3px;line-height:1.3}
.btns{display:flex;gap:8px;flex-wrap:wrap}
/* navegación */
nav.toc{position:sticky;top:0;z-index:20;background:rgba(250,248,245,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--linea);margin-top:14px}
nav.toc .wrap{display:flex;gap:4px;overflow-x:auto;padding-top:7px;padding-bottom:7px;scrollbar-width:none}
nav.toc a{white-space:nowrap;text-decoration:none;color:var(--gris);font-size:13px;font-weight:500;padding:5px 10px;border-radius:6px}
nav.toc a:hover,nav.toc a.on{color:var(--negro);background:var(--gris-cl)}
/* fichas desplegables */
.fichas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:18px}
details.ficha{min-width:0;background:var(--papel);border-radius:10px;box-shadow:var(--sombra);border-left:4px solid var(--negro)}
details.ficha.ancha{grid-column:1/-1}
details.ficha>summary{cursor:pointer;list-style:none;padding:11px 16px;display:flex;align-items:center;gap:10px;font:700 16px Barlow}
details.ficha>summary::-webkit-details-marker{display:none}
details.ficha>summary .n{color:var(--rojo);font-size:14px;min-width:22px}
details.ficha>summary .res{min-width:0;font:400 13px Inter;color:var(--gris);margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
details.ficha>summary::after{content:'+';margin-left:auto;font:600 20px Inter;color:var(--gris)}
details.ficha[open]>summary::after{content:'–'}
details.ficha[open]{border-left-color:var(--rojo)}
details.ficha .cuerpo{padding:0 18px 16px;font-size:14px}
details.ficha .cuerpo p{margin:0 0 8px}
details.ficha .cuerpo ul{margin:0;padding-left:20px}
details.ficha .cuerpo li{margin:3px 0}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--linea);border:1px solid var(--linea);border-radius:8px;overflow:hidden}
.datos div{background:var(--papel);padding:8px 12px;font-size:13px}
.datos span{display:block;color:var(--gris);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
/* secciones abiertas */
section{padding:30px 0 6px}
section h2{font-size:24px;display:flex;align-items:baseline;gap:12px;margin-bottom:12px}
section h2 .n{color:var(--rojo);font-size:17px;min-width:24px}
section h3{font-size:17px;margin:20px 0 10px}
.card{background:var(--papel);border-radius:12px;box-shadow:var(--sombra);padding:18px 20px}
.card p{margin:0 0 8px}
.nota{font-size:12.5px;color:var(--gris);border-left:3px solid var(--prop);background:#fff8e8;padding:9px 13px;border-radius:0 8px 8px 0;margin-top:12px}
.tabla{width:100%;border-collapse:collapse;font-size:13px}
.tabla th{background:var(--negro);color:#fff;text-align:left;font-weight:600;padding:7px 9px;font-size:12px;white-space:nowrap}
.tabla td{white-space:nowrap;padding:6px 9px;border-bottom:1px solid var(--linea);font-variant-numeric:tabular-nums}
.tabla td.num,.tabla th.num{text-align:right}
.scroll{overflow-x:auto}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.chip.r{background:#fde5dc;color:#9b2a09}.chip.a{background:#fff1cc;color:#7a5400}.chip.v{background:#e3f2e4;color:#1d5e21}
.dados-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 10px}
.dados-tabs button{font:600 14px Inter;padding:7px 13px;border-radius:8px;border:1.5px solid var(--linea);background:var(--papel);cursor:pointer;color:var(--negro)}
.dados-tabs button.on{background:var(--negro);color:#fff;border-color:var(--negro)}
.dado-grid{display:grid;grid-template-columns:minmax(320px,470px) 1fr;gap:18px;align-items:start}
.plan-box{background:var(--papel);border-radius:12px;box-shadow:var(--sombra);padding:14px}
.plan-box svg{width:100%;height:auto;display:block}
.simb.lista span{white-space:normal}
.simb.lista{flex-direction:column;align-items:flex-start;display:flex;gap:5px;font-size:12.5px;margin-top:10px;border-top:1px solid var(--linea);padding-top:10px}
.ctrl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris);margin:2px 0 8px}
.dado-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.dado-res div{background:var(--gris-cl);border-radius:8px;padding:9px 12px;font-size:12.5px;color:var(--gris)}
.dado-res b{display:block;font:700 20px Barlow;color:var(--negro)}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.alt{background:var(--gris-cl);border-radius:10px;padding:14px 16px;border-top:4px solid var(--gris)}
.alt.pref{border-top-color:var(--rojo)}
.alt h4{font:700 16px Barlow;margin:0 0 4px}
.alt .tag{display:inline-block;background:var(--rojo);color:#fff;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.alt dt{font-weight:600;font-size:11.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.alt dd{margin:2px 0 0;font-size:13.5px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.galeria figure{margin:0;background:var(--papel);border-radius:10px;overflow:hidden;box-shadow:var(--sombra);cursor:zoom-in}
.galeria img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#ddd}
.galeria.planos img{aspect-ratio:4/3;object-fit:contain;background:#fff}
.galeria figcaption{font-size:12.5px;padding:8px 11px;color:var(--gris)}
.galeria figcaption b{color:var(--negro)}
.comp{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.comp > div{background:var(--papel);border-radius:12px;box-shadow:var(--sombra);padding:12px}
.comp img{width:100%;height:auto;display:block;cursor:zoom-in}
.comp .t{font:700 13px Barlow;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.comp .t.p{color:var(--proy)}.comp .t.o{color:var(--obra)}
.comp .pie{font-size:12.5px;color:var(--gris);margin-top:6px}
.lightbox{position:fixed;inset:0;background:rgba(20,15,12,.92);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;padding:20px}
.lightbox.on{display:flex}
.lightbox img{max-width:94vw;max-height:84vh;border-radius:6px;background:#fff}
.lightbox p{color:#eee;max-width:900px;text-align:center;font-size:14px}
.lightbox button{position:absolute;top:14px;right:18px;background:none;border:none;color:#fff;font-size:34px;cursor:pointer}
.descargas{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.desc{display:flex;gap:14px;align-items:center;background:var(--papel);border-radius:12px;box-shadow:var(--sombra);padding:14px 16px;text-decoration:none;color:var(--negro);border:1.5px solid transparent}
.desc:hover{border-color:var(--rojo)}
.desc .ic{width:44px;height:44px;border-radius:10px;background:var(--negro);color:#fff;display:grid;place-items:center;font:700 12px Barlow;flex:none}
.desc.dwg .ic{background:var(--rojo)}
.desc b{display:block;font:700 16px Barlow}
.desc span{font-size:12.5px;color:var(--gris)}
.firma{text-align:center;padding:40px 0 30px}
.firma .linea{width:280px;border-top:1.5px solid var(--negro);margin:56px auto 8px}
.firma b{font:700 17px Barlow}
footer{border-top:3px solid var(--rojo);background:var(--negro);color:#b8aea6;font-size:12.5px;padding:16px 0;margin-top:20px}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media (max-width:1060px){ .diag{grid-template-columns:1fr} .resumen{max-height:none;min-height:0} }
@media (max-width:860px){
  .dado-grid,.alts,.fichas,.comp{grid-template-columns:minmax(0,1fr)}
  .top .meta{display:none}
  .visor{height:74vh;min-height:480px}
  .visor .vistas{top:auto;bottom:auto;top:52px;left:12px;right:12px;flex-direction:row;flex-wrap:wrap}
  .visor .vistas button{font-size:12px;padding:5px 8px}
  .visor .simb{font-size:10.5px;gap:3px 10px;padding:6px 9px}
  .mini{grid-template-columns:repeat(2,1fr)}
  .wrap{padding:0 14px}
}
@media print{ nav.toc,.visor,.btns,.ctrl,.dados-tabs{display:none!important} details.ficha{box-shadow:none} }
</style>
</head>

<script id="datos" type="application/json">{"contenido": {"id": "revision-anclas", "titulo": "Revisión en sitio de anclas para columnas", "subtitulo": "Verificación topográfica de anclas coladas previa al montaje de la estructura metálica", "proyecto": "Park In Tlal — Bodega 18A", "frente": "Estructura metálica", "ubicacion": "S. Isidro 7, Industrial Tlaxcolpan, 54030 Tlalnepantla, Edo. de Méx.", "folio": "ARCA-B18A-RF-001", "revision": "Rev. 1 — incluye levantamiento topográfico", "fecha": "25 de noviembre de 2026", "fecha_visita": "23 de noviembre de 2026", "referencia": "CIM-04 Planta de placas base, rev. V004", "participantes": "ARCA (estructura metálica y topografía), equipo de ingeniería, obra civil y terracerías", "elementos": "3 dados con anclas coladas: A-1, poste de viento sobre eje 1 (entre A y B) y B-1", "pdf": "Revision_Sitio_Anclas_Columnas_Bodega18A.pdf", "levantamiento": "05-topografia/2026-11-25_levantamiento-anclas/levantamiento.json", "plano_topografico": "05-topografia/2026-11-25_levantamiento-anclas/LEVANTAMIENTO DE ANCLAS Y PLANO ALINEADO.dwg", "firma": {"nombre": "Ing. Noé Prudencio", "cargo": "Director General", "empresa": "GRUPO ARCA"}, "secciones": [{"id": "objetivo", "titulo": "Objetivo", "parrafos": ["Dejar constancia de la visita en sitio realizada por ARCA junto con los equipos de ingeniería, obra civil y terracerías, con apoyo de la brigada de topografía de ARCA. En ella se verificó la posición de las anclas coladas en los dados de cimentación antes del montaje de las columnas metálicas. Este reporte integra el levantamiento topográfico de las anclas y propone alternativas de solución para acordarlas con el contratista de obra civil y el proyectista estructural."]}, {"id": "trabajos", "titulo": "Trabajos realizados en sitio", "vinetas": ["Junto con el equipo de terracerías se revisaron los bancos de nivel y las referencias de proyecto. Con ellos, la brigada de topografía rectificó los ejes.", "Se alineó el plano estructural con los puntos de referencia de obra, sin modificar la geometría del proyecto, y se trazaron sobre él las anclas físicas.", "De cada ancla se levantó la corona (punta del ancla) y la base en el colado, para medir su desfase y su desplome.", "Se comentaron los hallazgos en sitio con el equipo de obra civil."]}, {"id": "observaciones", "titulo": "Observaciones", "parrafos": ["En la revisión se detectaron <b>3 dados<\/b> ya colados (A-1, poste de viento sobre eje 1 entre A y B, y B-1) con las siguientes condiciones:"], "vinetas": ["<b>Desfase de las anclas<\/b> respecto a la posición de proyecto: en promedio 49 mm, con un máximo de 77.5 mm. El corrimiento es bastante uniforme: unos 30 mm a lo largo del eje 1 hacia el eje B y de 28 a 42 mm hacia el exterior (alejándose del eje 2).", "<b>Anclas fuera de plomo<\/b>: el desplome máximo medido es de 14.7 mm, y 3 de las 35 anclas con base medida superan 10 mm.", "La posición de las anclas no es un corrimiento puro: entre anclas de un mismo dado hay diferencias de hasta 33 mm respecto al desfase promedio."], "parrafos2": ["Es posible que en distintas etapas de la obra se hayan usado referencias diferentes, por lo que se propone conciliar los ejes en conjunto antes de definir la solución."]}, {"id": "levantamiento", "titulo": "Levantamiento topográfico", "tipo": "levantamiento", "parrafos": ["La brigada de topografía alineó el plano estructural con los puntos de referencia de obra y levantó cada ancla física. De cada ancla se tiene la <b>posición de proyecto<\/b>, la <b>corona<\/b> (punta del ancla en campo) y la <b>base<\/b> (donde sale del concreto). La diferencia entre corona y base es el desplome del ancla. Los niveles de corona están referidos al piso de la nave existente (NPT = 0.000). <br/><b>Colores en este reporte:<\/b> verde = proyecto, rojo = ancla en obra (corona), azul = base del ancla, ámbar = placa y barrenos propuestos. En el plano del topógrafo los colores son otros: rojo = proyecto, amarillo = corona y blanco = base.", "Para validar la alineación con el modelo estructural se usaron los dados A-1 y B-1 como referencia. La distancia entre ellos es de 15.287 m en el levantamiento y 15.288 m en el proyecto. Con esa alineación, el centro del tercer dado cae a 3 mm de su posición en el modelo."], "nota": "Desfase medido en la corona del ancla, que es donde asienta la placa. Sentido +u: a lo largo del eje 1 hacia el eje B. Sentido +v: hacia el eje 2 (interior de la nave); un valor negativo indica desfase hacia el exterior. En el poste de viento no se levantó la base del ancla 8, por lo que no se reporta su desplome."}, {"id": "implicaciones", "titulo": "Implicaciones técnicas", "parrafos": ["En las placas de proyecto, los barrenos están a 50 mm del borde: 600 × 600 mm con barrenos Ø21 mm para PL-PB1-1, y 500 × 700 mm para PL-PB2-1. Con los desfases medidos, el centro de algunas anclas queda prácticamente en el borde de la placa: a 2 mm en A-1 y a 8 mm en B-1. En el poste de viento, una queda 2 mm fuera de la placa. Esto es menor que la distancia mínima al borde que pide la especificación (del orden de 25 mm para tornillos de 3/4\", AISC 360, Tabla J3.4). Por eso las placas de proyecto no pueden montarse sin adecuaciones.", "Como el desfase no es igual en todas las anclas, un solo corrimiento de barrenos no es suficiente: cada dado requiere su propia plantilla con las posiciones levantadas. Además, los niveles de corona varían entre −0.156 y −0.191 m, hasta 35 mm dentro de un mismo dado. Hay que verificar que la longitud libre de cada ancla permita colocar la placa, el grout de 50 mm, la arandela y las tuercas."]}, {"id": "alternativas", "titulo": "Alternativas de solución propuestas", "tipo": "alternativas", "alternativas": [{"titulo": "A. Adecuar la placa base", "etiqueta": "Propuesta preferente", "descripcion": "Fabricar para estos 3 dados placas ampliadas hacia el lado del desfase. Los barrenos irían en la posición real de cada ancla según el levantamiento, agrandados a Ø33 mm (1-5/16\") para absorber el desplome y las tolerancias, con placa-arandela de 1/4\" × 2\" (6 × 51 mm) soldada en campo (AISC, Manual de Construcción en Acero, Tabla 14-2, para anclas de 3/4\"). Con 50 mm al borde, igual que en proyecto, las medidas serían: A-1 de 635 × 650 mm, poste de viento de 555 × 745 mm y B-1 de 645 × 635 mm.", "consideraciones": "No requiere demoler y tiene menor impacto en el programa. Requiere el visto bueno del proyectista estructural para el tamaño de placa, el espesor, las soldaduras y las distancias al borde. También hay que confirmar que la placa ampliada quede dentro del dado de 800 × 800 mm, cuya cara no se levantó."}, {"titulo": "B. Corregir dados y anclas", "etiqueta": "", "descripcion": "Demoler los dados afectados y volver a colocar las anclas con plantilla, verificadas por topografía antes del colado. Después, volver a colar los dados.", "consideraciones": "Recupera la condición original del proyecto. Implica demolición, armado, cimbra, colado y curado, con impacto en tiempo y costo. Hay que cuidar no dañar la zapata ni la contratrabe."}], "parrafos": ["ARCA propone revisar primero la <b>alternativa A<\/b>, porque resuelve la situación sin demoliciones. Si el proyectista estructural no la valida, o si el desplome de alguna ancla no permite presentar la placa, se procedería con la <b>alternativa B<\/b> en los dados que lo requieran."]}, {"id": "pasos", "titulo": "Siguientes pasos sugeridos", "vinetas": ["Conciliar ejes y bancos de nivel entre topografía de ARCA, terracerías y obra civil.", "Enviar este levantamiento al proyectista estructural para validar la alternativa A (dimensiones de placa y tratamiento del desplome).", "Levantar la cara de los 3 dados y la base faltante del ancla 8 del poste de viento.", "Reunión de coordinación entre obra civil, ingeniería, terracerías y ARCA para acordar la solución y el programa.", "En los dados por colar, revisar en conjunto la posición de las anclas con plantilla y topografía antes de cada colado. ARCA puede compartir las plantillas 1:1 de las placas base."]}], "fotos": [{"archivo": "foto_1.jpg", "pie": "Brigada de topografía de ARCA rectificando ejes con estación total, respecto al banco de nivel de terracerías."}, {"archivo": "foto_2.jpg", "pie": "Revisión en sitio con el equipo de obra civil, con los planos estructurales."}, {"archivo": "foto_3.jpg", "pie": "Revisión de bancos de nivel con el equipo de terracerías."}, {"archivo": "foto_4.jpg", "pie": "Dado colado con 12 anclas (conexión PB-1). Se aprecian los ejes rectificados trazados sobre el dado."}, {"archivo": "foto_5.jpg", "pie": "Dado colado junto a la colindancia, con referencia topográfica marcada en la contratrabe."}, {"archivo": "foto_6.jpg", "pie": "Medición de la separación entre anclas contra la posición de proyecto."}, {"archivo": "foto_7.jpg", "pie": "Verificación de la posición y el plomo de las anclas en el dado de colindancia."}], "carpeta_fotos": "03-reportes/fotos/2026-11-23_visita-anclas", "recortes": [{"archivo": "CIM-04_PL-PB1-1.png", "pie": "Placa PL-PB1-1: 600 × 600 mm, e=3/4\", 12 barrenos Ø21 mm (CIM-04)"}, {"archivo": "CIM-04_conexion-PB-1_planta.png", "pie": "Conexión PB-1 / Planta: placa, cartabones y 12 anclas AN-1 (CIM-04)"}, {"archivo": "CIM-04_conexion-PB-1_corte.png", "pie": "Conexión PB-1 / Corte: dado D-5 de 800 mm, grout 50 mm (CIM-04)"}, {"archivo": "CIM-04_AN-1.png", "pie": "Ancla AN-1: 12 redondos OS 3/4\" con placas de succión (CIM-04)"}, {"archivo": "CIM-04_PL-PB2-1.png", "pie": "Placa PL-PB2-1: 500 × 700 mm, e=1/2\", 12 barrenos Ø21 mm (CIM-04)"}, {"archivo": "CIM-04_conexion-PB-2_planta.png", "pie": "Conexión PB-2 / Planta: poste de viento PV-1 (CIM-04)"}, {"archivo": "EST-12_PB-3_planta-y-PL-PB3-1.png", "pie": "Conexión PB-3 y placa PL-PB3-1: 200 × 120 mm, e=1/2\", 4 anclas OS 5/8\" (EST-12)", "ancho": "completo"}, {"archivo": "CIM-04_ubicacion-placas-base.png", "pie": "Ubicación de placas base, escala 1:100 (CIM-04). Cotas en cm.", "ancho": "completo"}], "carpeta_recortes": "03-reportes/recortes-planos", "descargas": [{"archivo": "LEVANTAMIENTO DE ANCLAS Y PLANO ALINEADO.dwg", "origen": "05-topografia/2026-11-25_levantamiento-anclas/LEVANTAMIENTO DE ANCLAS Y PLANO ALINEADO.dwg", "titulo": "Plano topográfico", "detalle": "Levantamiento de anclas y plano alineado (DWG, AutoCAD)"}, {"archivo": "Revision_Sitio_Anclas_Columnas_Bodega18A.pdf", "origen": "03-reportes/Revision_Sitio_Anclas_Columnas_Bodega18A.pdf", "titulo": "Reporte en PDF", "detalle": "Reporte completo membretado ARCA"}, {"archivo": "Placas_Base_Columnas_Bodega18A.pdf", "origen": "02-placas-base/Placas_Base_Columnas_Bodega18A.pdf", "titulo": "Placas base y plantillas 1:1", "detalle": "Medidas de proyecto de las placas base (PDF)"}], "cliente": "T-REINVENTA", "barreno_propuesto": {"diametro_mm": 33, "texto": "Ø33 mm (1-5/16\")", "arandela": "placa-arandela de 1/4\" × 2\" (6 × 51 mm)", "referencia": "AISC, Manual de Construcción en Acero, Tabla 14-2, para anclas de 3/4\""}, "resumen": {"recorrido": "El 23 de noviembre ARCA recorrió los dados ya colados con los equipos de ingeniería, obra civil y terracerías. La brigada de topografía rectificó los ejes con los bancos de nivel y levantó las 36 anclas de 3 dados: A-1, el poste de viento sobre el eje 1 y B-1.", "hallazgos": ["Las anclas están corridas en promedio <b>49 mm<\/b> (máximo <b>77.5 mm<\/b>): unos 30 mm hacia el eje B y de 28 a 42 mm hacia el exterior.", "Algunas anclas están fuera de plomo: el desplome máximo es de <b>14.7 mm<\/b>.", "Con la placa de proyecto, varias anclas quedan en el borde de la placa o fuera de ella, así que no se puede montar tal cual."], "propuesta": "<b>Alternativa A (preferente):<\/b> placas ampliadas hacia el lado del desfase, con barrenos agrandados de Ø33 mm en la posición real de cada ancla y placa-arandela soldada en campo. Medidas: A-1 de 635 × 650 mm, poste de viento de 555 × 745 mm y B-1 de 645 × 635 mm. Requiere la validación del proyectista estructural. <b>Alternativa B:<\/b> demoler y volver a colar los dados.", "fotos": ["foto_4.jpg", "foto_5.jpg"]}, "url_web": "https://arqjorgeml1204.github.io/reportes-bodega18-tlal/revision-anclas/"}, "levantamiento": {"fuente": "LEVANTAMIENTO DE ANCLAS Y PLANO ALINEADO.dwg", "notas_topografo": ["Resumen de visita topografica", "Los puntos en amarillo son la corona de la ancla fisica en campo", "Los puntos en blanco es la ubicacion de la base de ancla en el colado asi se puede apreciar el desplome de la ancla", "la nomenclatura en verde es el nivel en que se encuentra la corona  tomando en cuenta el nivel cero del piso que se encuentra en la nave existente", "El plano ya se encuentra alineado en base a los puntos que nos entrago el ing. Raul Blas. No se modifica nada de la estructura solo se traza con lo fisico en campo.", "Los bloques que se encuentran en color rojo es la posicion real de las anclas conforme a  proyecto. Ahi nos damos cuenta del desface de las que se encuentran fisicamente."], "convenciones": {"u": "hacia eje B", "v": "hacia eje 2", "unidades": "mm", "nivel": "m respecto a NPT nave existente = 0.000", "borde_min_propuesto": 50, "tol_desplome": 10}, "ajuste": {"dist_A1_B1_levantamiento_m": 15.287, "dist_A1_B1_modelo_m": 15.288, "error_PB2_mm": 3.1}, "resumen": {"dados": 3, "anclas": 36, "medidas": 36, "sin_base": 1, "prom_desfase": 49.3, "max_desfase": 77.5, "max_desplome": 14.7, "desplome_revisar": 3}, "dados": [{"id": "A-1", "tipo": "PB-1", "placa": "PL-PB1-1", "elemento": "Columna CM-1", "placa_proyecto_mm": [600, 600], "centro_modelo": [-17377.4, 204.3], "centro_utm": [479327.41, 2162305.588], "centro_levantado_modelo": [-17377.4, 204.3], "n_anclas": 12, "n_medidas": 12, "n_con_base": 12, "prom_cor_du": 28.0, "prom_cor_dv": -41.8, "prom_cor_d": 51.2, "prom_base_du": 29.1, "prom_base_dv": -37.7, "max_cor_d": 77.5, "max_base_d": 68.1, "max_desplome": 14.7, "prom_desplome": 5.0, "n_desplome_revisar": 2, "dispersion_max": 31.9, "nivel_corona_min": -0.191, "nivel_corona_max" function planoUbicacion(){
  const X={1:0,2:1990,3:3740}, Y={A:0,B:1529,C:3124,D:4743};
  const W=3740,H=4743, m=420, sx=x=>x+m, sy=y=>y+m;
  let g=`<svg viewBox="0 0 ${W+2*m} ${H+2*m}" style="max-height:520px" font-family="Inter" role="img" aria-label="Planta de ubicación de los dados revisados">`;
  for(const [k,x] of Object.entries(X)) g+=`<line x1="${sx(x)}" y1="${sy(-200)}" x2="${sx(x)}" y2="${sy(H+200)}" stroke="#bbb" stroke-width="8" stroke-dasharray="60 30 10 30"/><circle cx="${sx(x)}" cy="${sy(-300)}" r="110" fill="#fff" stroke="#211915" stroke-width="10"/><text x="${sx(x)}" y="${sy(-300)+45}" font-size="130" text-anchor="middle" font-weight="600">${k}</text>`;
  for(const [k,y] of Object.entries(Y)) g+=`<line x1="${sx(-200)}" y1="${sy(y)}" x2="${sx(W+200)}" y2="${sy(y)}" stroke="#bbb" stroke-width="8" stroke-dasharray="60 30 10 30"/><circle cx="${sx(-300)}" cy="${sy(y)}" r="110" fill="#fff" stroke="#211915" stroke-width="10"/><text x="${sx(-300)}" y="${sy(y)+45}" font-size="130" text-anchor="middle" font-weight="600">${k}</text>`;
  g+=`<rect x="${sx(0)}" y="${sy(0)}" width="${W}" height="${H}" fill="none" stroke="#d8d2c8" stroke-width="14"/>`;
  const rev={'A-1':1,'B-1':1};
  for(const a of 'ABCD') for(const e of [1,2,3]){ const id=a+'-'+e, on=rev[id]; g+=`<rect x="${sx(X[e])-60}" y="${sy(Y[a])-60}" width="120" height="120" fill="${on?'#C3360E':'#8a8f98'}"/>`; if(on) g+=`<text x="${sx(X[e])+110}" y="${sy(Y[a])+45}" font-size="120" font-weight="700" fill="#C3360E">${id}</text>`; }
  [[0,468],[0,1529+798],[0,3124+810],[995,H],[1990+875,H]].forEach(([x,y],i)=>{ const on=i===0; g+=`<rect x="${sx(x)-50}" y="${sy(y)-70}" width="100" height="140" fill="${on?'#C3360E':'#8a8f98'}"/>`; if(on) g+=`<text x="${sx(x)+110}" y="${sy(y)+45}" font-size="120" font-weight="700" fill="#C3360E">Poste eje 1 (a 4.68 m de A)</text>`; });
  g+=`<g transform="translate(${sx(W)-900},${sy(H)+250})"><rect width="120" height="120" fill="#C3360E" y="-90"/><text x="160" y="20" font-size="110">Revisado</text><rect x="760" width="120" height="120" fill="#8a8f98" y="-90"/><text x="920" y="20" font-size="110">Otros</text></g>`;
  return g+`</svg><div style="font-size:12px;color:var(--gris);margin-top:6px">Planta esquemática según CIM-04 (cotas entre ejes en cm). En rojo, los 3 dados con anclas coladas que se revisaron.</div>`;
}

  w.append(h('div',{class:'dado-res'},`<div><b>${f1(d.prom_cor_d)} mm</b>desfase promedio</div><div><b>${f1(d.max_cor_d)} mm</b>desfase máximo</div><div><b>${f1(d.max_desplome)} mm</b>desplome máximo</div><div><b>${f1(d.dispersion_max)} mm</b>diferencia máx. entre anclas</div>`));

  sel.onchange = ()=>setK(+sel.value); ctrl.append(sel); pb.append(ctrl);

  ${d.anclas.map(a=>`<tr><td><b>${a.n}</b></td><td class="num">${a.proy_u}, ${a.proy_v}</td><td class="num">${f1(a.cor_du)}</td><td class="num">${f1(a.cor_dv)}</td><td class="num"><span class="chip ${a.cor_d>60?'r':a.cor_d>40?'a':'v'}">${f1(a.cor_d)}</span></td><td class="num">${a.desplome==null?'<span title="Base no levantada">s/d</span>':`<span class="chip ${a.desplome>L.convenciones.tol_desplome?'a':'v'}">${f1(a.desplome)}</span>`}</td><td class="num">${a.nivel_corona.toFixed(3)}</td></tr>`).join('')}
  </tbody></table><div style="font-size:12px;color:var(--gris);margin-top:6px">mm, salvo el nivel (m respecto a NPT de la nave existente). u: eje 1 hacia B; v: hacia eje 2 (negativo = hacia el exterior). s/d: base no levantada.</div>`;
  g.append(t); w.append(g);

function planDado(d, k){
  const [pu,pv] = [d.placa_proyecto_mm[0]/2, d.placa_proyecto_mm[1]/2];
  const R=480, P=d.placa_propuesta;
  let s = `<svg viewBox="${-R-40} ${-R-20} ${2*R+80} ${2*R+70}" font-family="Inter" role="img" aria-label="Planta del dado ${d.id} con anclas">`;
  s += `<rect x="-400" y="-400" width="800" height="800" fill="#ece7e0" stroke="#b9ada0" stroke-width="2" stroke-dasharray="10 6"/><text x="-390" y="-372" font-size="24" fill="#8a7f74">Dado 800 × 800 (posición de proyecto)</text>`;
  s += `<rect x="${-pv}" y="${-pu}" width="${2*pv}" height="${2*pu}" fill="rgba(46,125,50,.06)" stroke="#2E7D32" stroke-width="3"/>`;
  s += `<rect x="${P.v0}" y="${P.u0}" width="${P.ancho_v}" height="${P.largo_u}" fill="none" stroke="#C98A00" stroke-width="3" stroke-dasharray="14 8"/>`;
  s += `<line x1="0" y1="${-R}" x2="0" y2="${R-20}" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="20 8 4 8"/><line x1="${-R}" y1="0" x2="${R}" y2="0" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="20 8 4 8"/>`;
  for (const a of d.anclas){
    const px=a.proy_v, py=a.proy_u, cx=px+k*a.cor_dv, cy=py+k*a.cor_du;
    s += `<circle cx="${px}" cy="${py}" r="12" fill="none" stroke="#2E7D32" stroke-width="3.5"/>`;
    s += `<line x1="${px}" y1="${py}" x2="${cx}" y2="${cy}" stroke="#D7261E" stroke-width="2.2"/>`;
    if (a.base_dv!=null){ const bx=px+k*a.base_dv, by=py+k*a.base_du; s+=`<line x1="${bx}" y1="${by}" x2="${cx}" y2="${cy}" stroke="#1F5FBF" stroke-width="3"/><circle cx="${bx}" cy="${by}" r="8" fill="#1F5FBF"/>`; }
    s += `<circle cx="${cx}" cy="${cy}" r="10" fill="#D7261E"><title>Ancla ${a.n}: desfase ${f1(a.cor_d)} mm (u ${f1(a.cor_du)}, v ${f1(a.cor_dv)}); desplome ${a.desplome==null?'s/d':f1(a.desplome)+' mm'}; nivel corona ${a.nivel_corona.toFixed(3)} m</title></circle>`;
    const ox = px<0?-36:36, oy = py<0?-26:40;
    s += `<text x="${px+ox}" y="${py+oy}" font-size="30" font-weight="700" text-anchor="middle" fill="#211915">${a.n}</text>`;
  }
  s += `<g font-size="26" fill="#211915" font-weight="600"><text x="${R-10}" y="${R+40}" text-anchor="end">→ hacia eje 2 (v+)</text><text x="${-R-10}" y="${R+40}">↓ hacia eje B (u+)</text></g>`;
  if (k>1) s += `<text x="0" y="${-R+2}" text-anchor="middle" font-size="26" fill="#D7261E" font-weight="700">Desviaciones exageradas ×${k}</text>`;
  return s + `</svg>`;
}

function enSitio(d){
  // placa a escala real (sin exagerar): proyecto contra posición en obra y placa propuesta con barrenos agrandados
  const P=d.placa_propuesta, pu=d.placa_proyecto_mm[0]/2, pv=d.placa_proyecto_mm[1]/2;
  const v0=Math.min(P.v0,-pv)-190, v1=Math.max(P.v1,pv)+70, u0=Math.min(P.u0,-pu)-70, u1=Math.max(P.u1,pu)+90;
  let s=`<svg viewBox="${v0} ${u0} ${v1-v0} ${u1-u0}" font-family="Inter" role="img" aria-label="Placa ${d.placa} en sitio">`;
  s+=`<rect x="${P.v0}" y="${P.u0}" width="${P.ancho_v}" height="${P.largo_u}" fill="#FBF1DA" stroke="#C98A00" stroke-width="3" stroke-dasharray="14 8"/>`;
  s+=`<rect x="${-pv}" y="${-pu}" width="${2*pv}" height="${2*pu}" fill="none" stroke="#2E7D32" stroke-width="3"/>`;
  for (const a of d.anclas){ const px=a.proy_v, py=a.proy_u, cx=px+a.cor_dv, cy=py+a.cor_du;
    s+=`<circle cx="${px}" cy="${py}" r="10.5" fill="none" stroke="#2E7D32" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="${BAR/2}" fill="none" stroke="#C98A00" stroke-width="3"/><line x1="${px}" y1="${py}" x2="${cx}" y2="${cy}" stroke="#D7261E" stroke-width="2.5"/><circle cx="${cx}" cy="${cy}" r="9.5" fill="#D7261E"/>`;
    s+=`<text x="${cx+(px<0?-24:24)}" y="${cy+(py<0?-14:30)}" font-size="22" text-anchor="${px<0?'end':'start'}" fill="#211915">${a.n}: ${Math.round(a.cor_d)}</text>`; }
  s+=`<text x="${(P.v0+P.v1)/2}" y="${P.u1+50}" font-size="26" font-weight="700" text-anchor="middle" fill="#C98A00">${P.ancho_v} mm</text>`;
  s+=`<text x="${P.v0-20}" y="${(P.u0+P.u1)/2}" font-size="26" font-weight="700" text-anchor="end" fill="#C98A00">${P.largo_u} mm</text>`;
  return s+`</svg>`;
}

    g.append(h('a',{class:'desc '+ext.toLowerCase(),href:'descargas/'+encodeURIComponent(x.archivo),download:''},`<div class="ic">${ext}</div><div><b>${x.titulo}</b><span>${x.detalle}</span></div>`)); });
  s.append(g); }
main.append(h('div',{class:'firma'},`<div>Atentamente,</div><div class="linea"></div><b>${C.firma.nombre}</b><div>${C.firma.cargo}</div><div>${C.firma.empresa}</div>`));
$('#pie-izq').textContent = 'ARCA Infraestructura & Construcción · GRUPO ARCA';
$('#pie-der').textContent = `${C.proyecto} · ${C.folio} · ${C.fecha}`;
const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) [...toc.children].forEach(a => a.classList.toggle('on', a.getAttribute('href')==='#'+e.target.id)); }), {rootMargin:'-40% 0px -55% 0px'});
document.querySelectorAll('main section, #fichas').forEach(s => obs.observe(s));
</script>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const D = JSON.parse(document.getElementById('datos').textContent);
const L = D.levantamiento, C = D.contenido;
const BAR = (C.barreno_propuesto||{}).diametro_mm || 33;
const el = document.getElementById('visor');
if (matchMedia('(max-width:860px)').matches) document.getElementById('capas').removeAttribute('open');
iniciar().catch(e => { document.getElementById('carga').textContent = 'No se pudo cargar el modelo 3D: ' + e.message; });

async function iniciar(){
  const idx = await (await fetch('data/modelo.json')).json();
  const buf = await (await fetch('data/modelo.bin')).arrayBuffer();
  const O = idx.origen_modelo_mm;
  const P = (x,y,z) => new THREE.Vector3(x, z, -y);                       // modelo (m) -> three
  const M = (xm, ym, z=0) => P((xm-O[0])/1000, (ym-O[1])/1000, z);        // modelo (mm) -> three

  const W = el.clientWidth, H = el.clientHeight;
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(W,H);
  el.prepend(renderer.domElement);
  const lab = new CSS2DRenderer(); lab.setSize(W,H); Object.assign(lab.domElement.style,{position:'absolute',top:0,left:0,pointerEvents:'none'}); el.insertBefore(lab.domElement, el.querySelector('.capas'));
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#e9ecef');
  const cam = new THREE.PerspectiveCamera(40, W/H, 0.01, 500);
  const ctl = new OrbitControls(cam, renderer.domElement); ctl.enableDamping = true;
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8d8378, 1.1));
  const sol = new THREE.DirectionalLight(0xffffff, 1.4); sol.position.set(-20,40,25); scene.add(sol);

  const G = {estructura:new THREE.Group(), muros:new THREE.Group(), proyecto:new THREE.Group(), real:new THREE.Group(), propuesta:new THREE.Group(), etiquetas:new THREE.Group()};
  Object.values(G).forEach(g => scene.add(g)); G.muros.visible = false;

  // modelo estructural del proyecto
  for (const c of idx.capas){
    const a = new Float32Array(buf, c.offset*4, c.count), p = new Float32Array(c.count);
    for (let i=0;i<c.count;i+=3){ p[i]=a[i]; p[i+1]=a[i+2]; p[i+2]=-a[i+1]; }
    if (c.capa==='S-COLS'){
      const abajo=[], arriba=[];
      for (let i=0;i<p.length;i+=9){ const zc=(p[i+1]+p[i+4]+p[i+7])/3; (zc>0.02?arriba:abajo).push(...p.subarray(i,i+9)); }
      for (const [arr,trans] of [[abajo,false],[arriba,true]]){
        const gg=new THREE.BufferGeometry(); gg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(arr),3)); gg.computeVertexNormals();
        G.estructura.add(new THREE.Mesh(gg, trans ? new THREE.MeshStandardMaterial({color:'#9aa3ad', roughness:.6, metalness:.2, transparent:true, opacity:.22, depthWrite:false, side:THREE.DoubleSide})
                                                  : new THREE.MeshStandardMaterial({color:'#c9c1b6', roughness:.95, side:THREE.DoubleSide, flatShading:true})));
      }
      continue;
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(p,3)); g.computeVertexNormals();
    (c.capa==='A-WALL' ? G.muros : G.estructura).add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:c.color, roughness:.85, side:THREE.DoubleSide, flatShading:true})));
  }

  // ejes
  const zF = -1.30, EX = {1:0, 2:19.9, 3:37.4}, EY = {A:0, B:-15.29, C:-31.24, D:-47.43};
  const lm = new THREE.LineDashedMaterial({color:0x6b6b6b, dashSize:.6, gapSize:.3});
  const etiqueta = (txt, cls, pos, grupo=scene) => { const d=document.createElement('div'); d.className='etq '+cls; d.innerHTML=txt; const o=new CSS2DObject(d); o.position.copy(pos); grupo.add(o); return o; };
  const eje = (a,b,t,pos) => { const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),lm); l.computeLineDistances(); scene.add(l); etiqueta(t,'eje',pos); };
  for (const [k,x] of Object.entries(EX)) eje(P(x,2,zF), P(x,-49,zF), k, P(x,3.2,zF));
  for (const [k,y] of Object.entries(EY)) eje(P(-2,y,zF), P(39,y,zF), k, P(-3.2,y,zF));

  const COL = {proy:'#2E7D32', obra:'#D7261E', base:'#1F5FBF', prop:'#C98A00'};
  const Rr = 0.0095, hP = 0.15, zPl = 0.05;
  const mat = c => new THREE.MeshStandardMaterial({color:c, roughness:.45, metalness:.2});
  const matV = mat(COL.proy), matR = mat(COL.obra), matB = mat(COL.base);
  const cil = (a,b,m,r=Rr) => { const v=new THREE.Vector3().subVectors(b,a); const me=new THREE.Mesh(new THREE.CylinderGeometry(r,r,v.length(),14), m);
    me.position.copy(a).addScaledVector(v,.5); me.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), v.clone().normalize()); return me; };
  // placa con barrenos: forma en (v,u) local en metros, extruida hacia abajo
  const placa = (d, u0,u1,v0,v1, huecos, rHueco, color, opac, zTop) => {
    const sh = new THREE.Shape(); sh.moveTo(v0/1000,u0/1000); sh.lineTo(v1/1000,u0/1000); sh.lineTo(v1/1000,u1/1000); sh.lineTo(v0/1000,u1/1000); sh.closePath();
    for (const [u,v] of huecos){ const hp=new THREE.Path(); hp.absarc(v/1000,u/1000,rHueco/1000,0,Math.PI*2,true); sh.holes.push(hp); }
    const g = new THREE.ExtrudeGeometry(sh,{depth:0.019,bevelEnabled:false,curveSegments:20}); g.rotateX(Math.PI/2);
    const me = new THREE.Mesh(g, new THREE.MeshStandardMaterial({color, transparent:opac<1, opacity:opac, roughness:.6, metalness:.25, side:THREE.DoubleSide, depthWrite:opac>=1}));
    me.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,30), new THREE.LineBasicMaterial({color})));
    const [cx,cy] = d.centro_modelo; me.position.set((cx-O[0])/1000, zTop, -(cy-O[1])/1000); return me;
  };

  const reales = [], vistas = [{t:'Vista general', pos:P(30,-62,30), tgt:P(12,-22,-2), dado:null}];
  for (const d of L.dados){
    const [cx,cy] = d.centro_modelo, pu=d.placa_proyecto_mm[0]/2, pv=d.placa_proyecto_mm[1]/2, pp=d.placa_propuesta;
    // proyecto: placa con barrenos Ø21 y anclas verdes
    G.proyecto.add(placa(d, -pu,pu,-pv,pv, d.anclas.map(a=>[a.proy_u,a.proy_v]), 10.5, COL.proy, .35, zPl+0.019));
    for (const a of d.anclas){ const [px,py]=a.proy_modelo; G.proyecto.add(cil(M(px,py,-0.25), M(px,py,hP), matV)); }
    // propuesta: placa ampliada con barrenos agrandados en la posición real (corona)
    G.propuesta.add(placa(d, pp.u0,pp.u1,pp.v0,pp.v1, d.anclas.map(a=>[a.proy_u+a.cor_du, a.proy_v+a.cor_dv]), BAR/2, COL.prop, .55, zPl+0.041));
    // cotas de la placa propuesta y de proyecto
    const c0 = M(cx,cy,0);
    const local = (u,v,z) => M(cx+v, cy-u, z);
    etiqueta(`${pp.ancho_v} mm`, 'cota', local(pp.u1+60,(pp.v0+pp.v1)/2,zPl+0.05), G.etiquetas);
    etiqueta(`${pp.largo_u} mm`, 'cota', local((pp.u0+pp.u1)/2,pp.v0-90,zPl+0.05), G.etiquetas);
    etiqueta(`Proyecto ${d.placa_proyecto_mm[0]}×${d.placa_proyecto_mm[1]} · Ø21`, 'cota v', local(-pu-70,0,zPl+0.03), G.etiquetas);
    const nivProm = d.anclas.reduce((s,a)=>s+a.nivel_corona,0)/d.anclas.length;
    for (const a of d.anclas){
      const [px,py] = a.proy_modelo;
      const r = { a, px, py, hc: hP + (a.nivel_corona - nivProm), objs:[] };
      r.lab = etiqueta(`${a.n} · ${Math.round(a.cor_d)} mm`, 'ancla', M(a.corona_modelo[0], a.corona_modelo[1], r.hc+0.03), G.etiquetas);
      r.lab.userData.dado = d.id; reales.push(r);
    }
    etiqueta(`${d.id==='1-AB'?'Poste eje 1':'Dado '+d.id} · desfase máx. ${d.max_cor_d.toFixed(1)} mm · placa propuesta ${pp.largo_u}×${pp.ancho_v}`, '', c0.clone().add(new THREE.Vector3(0,.62,0)));
    vistas.push({t: d.id==='1-AB'?'Poste eje 1 (A–B)':'Dado '+d.id, pos:c0.clone().add(new THREE.Vector3(0.95,0.95,0.85).multiplyScalar(el.clientWidth<700?1.7:1)), tgt:c0.clone().add(new THREE.Vector3(0,.06,0)), dado:d.id, c:c0});
  }
  const construir = k => {
    reales.forEach(r => { r.objs.forEach(o => G.real.remove(o)); r.objs = []; const a=r.a;
      const cxm = r.px + k*(a.corona_modelo[0]-r.px), cym = r.py + k*(a.corona_modelo[1]-r.py);
      const b = a.base_modelo ? [r.px + k*(a.base_modelo[0]-r.px), r.py + k*(a.base_modelo[1]-r.py)] : [cxm,cym];
      const top = M(cxm,cym,r.hc), bot = M(b[0],b[1],0);
      r.objs.push(cil(M(b[0],b[1],-0.25), bot, matR, Rr*1.05), cil(bot, top, matR, Rr*1.05));
      if (a.base_modelo){ const sb = new THREE.Mesh(new THREE.SphereGeometry(Rr*1.9,16,12), matB); sb.position.copy(bot); r.objs.push(sb); }
      // desfase: línea roja de la punta de proyecto a la punta en obra
      const pTop = M(r.px, r.py, hP+0.004), oTop = M(cxm, cym, r.hc+0.004);
      r.objs.push(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pTop,oTop]), new THREE.LineBasicMaterial({color:COL.obra, linewidth:2})));
      r.objs.forEach(o => G.real.add(o)); r.lab.position.copy(top).add(new THREE.Vector3(0,.03,0)); });
  };
  construir(1);

  el.querySelectorAll('input[data-c]').forEach(i => i.onchange = () => { G[i.dataset.c].visible = i.checked; });
  const ex = document.getElementById('exag'); ex.oninput = () => { document.getElementById('kx').textContent='×'+ex.value; construir(+ex.value); };
  const vb = document.getElementById('vistas'); let anim=null;
  vistas.forEach((v,i) => { const b=document.createElement('button'); b.textContent=v.t; b.onclick=()=>ir(i); vb.append(b); });
  function ir(i){ [...vb.children].forEach((b,j)=>b.classList.toggle('on',i===j)); const v=vistas[i];
    const p0=cam.position.clone(), t0=ctl.target.clone(), t=performance.now();
    anim = () => { const s=Math.min(1,(performance.now()-t)/900), e=s<.5?2*s*s:1-Math.pow(-2*s+2,2)/2;
      cam.position.lerpVectors(p0,v.pos,e); ctl.target.lerpVectors(t0,v.tgt,e); if (s>=1) anim=null; }; }
  // etiquetas de anclas sólo del dado que se está viendo de cerca
  const cercano = () => { let best=null, dmin=1e9; for (const v of vistas) if (v.c){ const dd=v.c.distanceTo(ctl.target); if (dd<dmin){dmin=dd;best=v;} }
    const cerca = cam.position.distanceTo(ctl.target) < 4.5 && dmin < 2.5;
    G.etiquetas.children.forEach(o => { o.visible = !!(cerca && (!o.userData.dado || o.userData.dado===best.dado) && (o.userData.dado || o.position.distanceTo(best.c) < 1.5)); }); };
  cam.position.copy(vistas[1].pos); ctl.target.copy(vistas[1].tgt); vb.children[1].classList.add('on');
  document.getElementById('carga').remove();
  new ResizeObserver(() => { const w=el.clientWidth, hh=el.clientHeight; renderer.setSize(w,hh); lab.setSize(w,hh); cam.aspect=w/hh; cam.updateProjectionMatrix(); }).observe(el);
  (function loop(){ requestAnimationFrame(loop); if (anim) anim(); ctl.update(); if (G.etiquetas.visible) cercano(); renderer.render(scene,cam); lab.render(scene,cam); })();
}
</script>
